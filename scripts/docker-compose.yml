x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 30s

services:
  webapi:
    image: todo-app:webapi-${TAG:-dev}
    build:
      context: ..
      dockerfile: src/TodoApp.WebApi/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
    restart: unless-stopped
    logging:
      driver: "json-file"  # logs in /var/lib/docker/containers/<container_id>/<container_id>-json.log. Find ID with: docker compose ps -q <service_name> or docker inspect <service_name>
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}/{{.ID}}"
        mode: "non-blocking"
    deploy:
      resources:
        limits:
          memory: "256M"  # nano: "128M", micro: "256M", small: "384M"

  worker:
    image: todo-app:worker-${TAG:-dev}
    build:
      context: ..
      dockerfile: src/TodoApp.WorkerService/Dockerfile
    environment:
      - DOTNET_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=tododb;Username=postgres;Password=postgres
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - HEARTBEAT_FILE=/tmp/healthy
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      # Fails when the heartbeat file is missing (unhealthy report) or stale (wedged process);
      # the health publisher rewrites it every 30s while the RabbitMQ connection is open.
      test: ["CMD-SHELL", "test -n \"$$(find \"$$HEARTBEAT_FILE\" -mmin -1 2>/dev/null)\""]
    restart: unless-stopped
    logging:
      driver: "json-file"  # logs in /var/lib/docker/containers/<container_id>/<container_id>-json.log. Find ID with: docker compose ps -q <service_name> or docker inspect <service_name>
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}/{{.ID}}"
        mode: "non-blocking"
    deploy:
      replicas: ${WORKER_REPLICAS:-8}  # measured optimum on a 3-core host (scripts/optimize-replicas-count.sh)
      resources:
        limits:
          memory: "256M"  # nano: "128M", micro: "256M", small: "384M"

  postgres:
    image: postgres:17
    environment:
      - POSTGRES_DB=tododb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      # - POSTGRES_INITDB_ARGS="--shared-preload-libraries=pg_stat_statements"
    logging:
      driver: "json-file"  # logs in /var/lib/docker/containers/<container_id>/<container_id>-json.log. Find ID with: docker compose ps -q <service_name> or docker inspect <service_name>
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}/{{.ID}}"
        mode: "non-blocking"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U postgres"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: "256M"  # nano: "128M", micro: "256M", small: "384M"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    logging:
      driver: "json-file"  # logs in /var/lib/docker/containers/<container_id>/<container_id>-json.log. Find ID with: docker compose ps -q <service_name> or docker inspect <service_name>
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}/{{.ID}}"
        mode: "non-blocking"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: "256M"  # nano: "128M", micro: "256M", small: "384M"

volumes:
  postgres_data:
